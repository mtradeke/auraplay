<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraPlay - Stream Your World</title>
    <style>
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #181818; --bg-hover: #272727;
            --text-primary: #f1f1f1; --text-secondary: #aaaaaa; --accent-blue: #0066ff;
            --border-color: #303030;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }

        header {
            position: sticky; top: 0; background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color); padding: 10px 24px;
            display: flex; align-items: center; justify-content: space-between; z-index: 100;
        }
        .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo-icon {
            width: 32px; height: 32px; background-color: var(--accent-blue);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .logo-icon::after {
            content: ''; display: block; width: 0; height: 0;
            border-style: solid; border-width: 6px 0 6px 10px;
            border-color: transparent transparent transparent white; margin-left: 2px;
        }
        .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }

        .search-container { display: flex; flex: 1; max-width: 600px; margin: 0 40px; }
        #search-input {
            flex: 1; padding: 10px 16px; background-color: var(--bg-secondary);
            border: 1px solid var(--border-color); border-right: none;
            border-radius: 20px 0 0 20px; color: var(--text-primary); font-size: 16px; outline: none;
        }
        #search-input:focus { border-color: var(--accent-blue); }
        #search-btn {
            padding: 0 24px; background-color: var(--bg-hover);
            border: 1px solid var(--border-color); border-radius: 0 20px 20px 0;
            color: var(--text-primary); cursor: pointer; font-size: 16px;
        }
        .auth-btn {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: transparent; border: 1px solid var(--accent-blue);
            color: var(--accent-blue); border-radius: 18px; cursor: pointer; font-weight: 500;
        }
        .auth-btn:hover { background: rgba(0, 102, 255, 0.1); }

        .app-container { display: flex; height: calc(100vh - 60px); }
        .sidebar {
            width: 240px; background-color: var(--bg-primary); padding: 12px;
            overflow-y: auto; border-right: 1px solid var(--border-color);
            display: none; 
        }
        @media (min-width: 1000px) { .sidebar { display: block; } }

        .sidebar-item {
            display: flex; align-items: center; gap: 20px; padding: 10px 12px;
            border-radius: 10px; cursor: pointer; color: var(--text-primary); font-size: 14px;
        }
        .sidebar-item:hover { background-color: var(--bg-hover); }
        .sidebar-item.active { background-color: var(--bg-hover); font-weight: 600; }

        main { flex: 1; padding: 24px; overflow-y: auto; }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; margin-top: 24px; }
        .section-title:first-child { margin-top: 0; }
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .video-card { cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: translateY(-4px); }
        .thumbnail-container {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background-color: var(--bg-secondary); border-radius: 12px; overflow: hidden;
        }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        .video-info { display: flex; gap: 12px; margin-top: 12px; }
        .channel-avatar {
            width: 36px; height: 36px; background-color: var(--accent-blue);
            border-radius: 50%; flex-shrink: 0;
        }
        .video-details h3 {
            font-size: 15px; font-weight: 500; line-height: 1.4; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .video-details p { font-size: 13px; color: var(--text-secondary); }

        #watch-view { display: none; max-width: 1200px; margin: 0 auto; padding: 24px; }
        .back-btn {
            background: none; border: none; color: var(--accent-blue); font-size: 16px;
            cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .player-wrapper {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background: black; border-radius: 12px; overflow: hidden;
        }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }
        .watch-title { font-size: 20px; font-weight: 600; margin-top: 16px; }
        .watch-channel { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 18px; }
        .error-msg { color: #ff4444; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="loadHomePage()">
            <div class="logo-icon"></div>
            <span class="logo-text">AuraPlay</span>
        </div>
        <form class="search-container" onsubmit="handleSearch(event)">
            <input type="text" id="search-input" placeholder="Search" autocomplete="off">
            <button type="submit" id="search-btn">🔍</button>
        </form>
        <button class="auth-btn" onclick="alert('To add real user accounts, we would need to connect a paid database like Firebase or Supabase!')">
            👤 Sign In
        </button>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-item active" onclick="loadHomePage()">🏠 Home</div>
            <div class="sidebar-item" onclick="loadCategory('trending')">🔥 Trending</div>
            <div class="sidebar-item" onclick="loadCategory('music')">🎵 Music</div>
            <div class="sidebar-item" onclick="loadCategory('movies')">🎬 Movies</div>
            <div class="sidebar-item" onclick="alert('Real user accounts require a paid database!')">❤️ Liked Videos</div>
            <div class="sidebar-item" onclick="alert('Real user accounts require a paid database!')">🕒 History</div>
        </aside>

        <main id="home-view">
            <div id="dynamic-content">
                <div class="loading">Loading awesome videos...</div>
            </div>
        </main>

        <main id="watch-view">
            <button class="back-btn" onclick="loadHomePage()">← Back to Home</button>
            <div class="player-wrapper">
                <iframe id="video-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <h1 class="watch-title" id="watch-title"></h1>
            <p class="watch-channel" id="watch-channel"></p>
        </main>
    </div>

    <script>
        // We are using a different, more reliable free server this time!
        const PIPED_API = 'https://pipedapi.r4fo.com';

        document.addEventListener('DOMContentLoaded', () => {
            loadHomePage();
        });

        async function loadHomePage() {
            // Reset view
            document.getElementById('home-view').style.display = 'block';
            document.querySelector('.sidebar').style.display = window.innerWidth >= 1000 ? 'block' : 'none';
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('video-player').src = '';

            const contentDiv = document.getElementById('dynamic-content');
            contentDiv.innerHTML = '<div class="loading">Loading awesome videos... (This might take a few seconds)</div>';
            
            try {
                const [trending, music, movies] = await Promise.all([
                    fetch(`${PIPED_API}/trending?region=US`).then(r => { if(!r.ok) throw new Error(); return r.json(); }),
                    fetch(`${PIPED_API}/search?q=pop+music+hits&filter=videos`).then(r => { if(!r.ok) throw new Error(); return r.json(); }),
                    fetch(`${PIPED_API}/search?q=movie+trailers+2024&filter=videos`).then(r => { if(!r.ok) throw new Error(); return r.json(); })
                ]);

                contentDiv.innerHTML = `
                    <h2 class="section-title">🔥 Trending Now</h2>
                    <div class="video-grid" id="grid-trending"></div>
                    <h2 class="section-title"> Top Music</h2>
                    <div class="video-grid" id="grid-music"></div>
                    <h2 class="section-title"> Popular Movies & Trailers</h2>
                    <div class="video-grid" id="grid-movies"></div>
                `;

                renderVideos('grid-trending', trending.slice(0, 8));
                renderVideos('grid-music', music.items.slice(0, 8));
                renderVideos('grid-movies', movies.items.slice(0, 8));

            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = `
                    <div class="error-msg">
                        <h3>⚠️ The free video server is currently busy!</h3>
                        <p>Please wait 2 minutes and refresh the page to try again.</p>
                    </div>`;
            }
        }

        async function loadCategory(category) {
            document.getElementById('home-view').style.display = 'block';
            document.querySelector('.sidebar').style.display = window.innerWidth >= 1000 ? 'block' : 'none';
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('video-player').src = '';

            const contentDiv = document.getElementById('dynamic-content');
            contentDiv.innerHTML = '<div class="loading">Loading...</div>';

            let query = category === 'trending' ? 'viral' : category;
            
            try {
                const response = await fetch(`${PIPED_API}/search?q=${query}&filter=videos`);
                if(!response.ok) throw new Error();
                const data = await response.json();
                
                contentDiv.innerHTML = `
                    <h2 class="section-title">${category.charAt(0).toUpperCase() + category.slice(1)}</h2>
                    <div class="video-grid" id="grid-category"></div>
                `;
                renderVideos('grid-category', data.items);
            } catch (error) {
                contentDiv.innerHTML = '<div class="error-msg">Failed to load videos. The free server is busy. Please refresh in a minute.</div>';
            }
        }

        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            document.getElementById('home-view').style.display = 'block';
            document.querySelector('.sidebar').style.display = window.innerWidth >= 1000 ? 'block' : 'none';
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('video-player').src = '';

            const contentDiv = document.getElementById('dynamic-content');
            contentDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(query)}&filter=videos`);
                if(!response.ok) throw new Error();
                const data = await response.json();
                
                contentDiv.innerHTML = `
                    <h2 class="section-title">Search results for "${query}"</h2>
                    <div class="video-grid" id="grid-search"></div>
                `;
                renderVideos('grid-search', data.items);
            } catch (error) {
                contentDiv.innerHTML = '<div class="error-msg">Search failed. The free server is busy. Please try again in a minute.</div>';
            }
        }

        function renderVideos(gridId, videos) {
            const grid = document.getElementById(gridId);
            if (!grid || !videos) return;
            grid.innerHTML = '';
            videos.forEach(video => {
                const videoId = video.url ? video.url.split('v=')[1] : null;
                if (!videoId) return;
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(videoId, video.title, video.uploaderName);
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${video.thumbnail}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/320x180?text=Video'">
                    </div>
                    <div class="video-info">
                        <div class="channel-avatar"></div>
                        <div class="video-details">
                            <h3>${video.title}</h3>
                            <p>${video.uploaderName || 'Unknown Channel'}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(videoId, title, channel) {
            document.getElementById('home-view').style.display = 'none';
            document.querySelector('.sidebar').style.display = 'none';
            document.getElementById('watch-view').style.display = 'block';
            document.getElementById('video-player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            document.getElementById('watch-title').innerText = title;
            document.getElementById('watch-channel').innerText = channel;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
