<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraPlay - Stream Your World</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #181818;
            --bg-hover: #272727;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-blue: #0066ff; /* Signature Blue */
            --accent-blue-hover: #004bbd;
            --border-color: #303030;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--accent-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 6px 0 6px 10px;
            border-color: transparent transparent transparent white;
            margin-left: 2px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .search-container {
            display: flex;
            flex: 1;
            max-width: 600px;
            margin: 0 40px;
        }

        #search-input {
            flex: 1;
            padding: 10px 16px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: 20px 0 0 20px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--accent-blue);
        }

        #search-btn {
            padding: 0 24px;
            background-color: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 0 20px 20px 0;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 16px;
        }

        #search-btn:hover {
            background-color: #383838;
        }

        /* --- MAIN CONTENT (HOME VIEW) --- */
        main {
            padding: 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .video-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .video-details h3 {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* --- WATCH VIEW (PLAYER) --- */
        #watch-view {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .watch-title {
            font-size: 20px;
            font-weight: 600;
            margin-top: 16px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .search-container { margin: 0 16px; }
            .logo-text { display: none; }
            main { padding: 16px; }
            .video-grid { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container" onclick="goHome()">
            <div class="logo-icon"></div>
            <span class="logo-text">AuraPlay</span>
        </div>
        
        <form class="search-container" onsubmit="handleSearch(event)">
            <input type="text" id="search-input" placeholder="Search for videos..." autocomplete="off">
            <button type="submit" id="search-btn">Search</button>
        </form>
        
        <div style="width: 40px; height: 40px; background: var(--bg-hover); border-radius: 50%;"></div>
    </header>

    <!-- HOME VIEW (Video Grid) -->
    <main id="home-view">
        <div class="video-grid" id="video-grid">
            <!-- Videos will be injected here by JavaScript -->
        </div>
    </main>

    <!-- WATCH VIEW (Video Player) -->
    <main id="watch-view">
        <button class="back-btn" onclick="goHome()">← Back to Home</button>
        <div class="player-wrapper">
            <iframe id="video-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <h1 class="watch-title" id="watch-title"></h1>
    </main>

    <script>
        // --- CONFIGURATION ---
        // To make the search bar work, you need a free YouTube Data API v3 Key.
        // Get one here: https://console.cloud.google.com/apis/credentials
        const API_KEY = 'YOUR_API_KEY_HERE'; 

        // Default videos to show on the homepage before searching
        const defaultVideos = [
            { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', channel: 'Rick Astley' },
            { id: 'jNQ48ZiqlDo', title: 'Beautiful Nature Scenery', channel: 'Nature Relaxation' },
            { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE', channel: 'officialpsy' },
            { id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito', channel: 'Luis Fonsi' }
        ];

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderVideos(defaultVideos);
        });

        // --- FUNCTIONS ---
        function renderVideos(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = ''; // Clear existing

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(video.id, video.title);
                
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
                    </div>
                    <div class="video-info">
                        <div class="channel-avatar"></div>
                        <div class="video-details">
                            <h3>${video.title}</h3>
                            <p>${video.channel}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(videoId, title) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('watch-view').style.display = 'block';
            
            // The magic happens here: autoplay=1 forces it to play automatically!
            document.getElementById('video-player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            document.getElementById('watch-title').innerText = title;
            
            window.scrollTo(0, 0); // Scroll to top
        }

        function goHome() {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('video-player').src = ''; // Stop the video
        }

        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            if (API_KEY === 'YOUR_API_KEY_HERE') {
                alert("Please add your YouTube API Key in the code to use the search feature!");
                return;
            }

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=12&key=${API_KEY}`);
                const data = await response.json();
                
                if (data.items) {
                    const videos = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle
                    }));
                    renderVideos(videos);
                    goHome(); // Ensure we are on the home view
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Failed to search. Check your API key or internet connection.');
            }
        }
    </script>
</body>
</html>
